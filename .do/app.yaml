name: patrick-portfolio
region: nyc
static_sites:
  - name: portfolio
    github:
      repo: puladlieu/Patrick-Ulad-lieu---Website-Portfolio
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: NODE_VERSION
        value: "24"
        scope: BUILD_TIME
      - key: VITE_SITE_URL
        value: https://patrick-ulad-lieu-stwsh.ondigitalocean.app
        scope: BUILD_TIME
      - key: VITE_WEB3FORMS_KEY
        value: ""
        scope: BUILD_TIME
